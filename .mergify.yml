merge_queue:
  mode: parallel
  max_parallel_checks: 1
scopes:
  source:
    files:
      security-critical:
        include:
          - security/**
  capacities:
    "security-*": 1
queue_rules:
  - name: VM2 trusted base injection
    queue_conditions:
      - base = main
    merge_conditions:
      - base = main
      - check-success = vm2-discriminator-never
    merge_method: merge
    merge_bot_account: livastic-vm2-primary-20260911
    branch_protection_injection_mode: queue
commands_restrictions:
  copy:
    conditions:
      - sender = livastic-vm2-secondary-20260911
      - scope != security-critical
