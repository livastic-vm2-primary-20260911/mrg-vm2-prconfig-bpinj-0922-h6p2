name: VM2 Annotation Provenance 0930
on:
  workflow_dispatch:
    inputs:
      emit_annotation:
        description: emit sibling annotation sentinel
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"
permissions:
  contents: read
jobs:
  annotation_source:
    name: vm2-annoretry-annotation-source
    runs-on: ubuntu-latest
    steps:
      - name: Optional sibling annotation
        shell: bash
        run: |
          if [ "${{ inputs.emit_annotation }}" = "yes" ]; then
            echo '::warning file=vm2-sibling.txt,line=1,title=VM2 sibling annotation::VM2_ANN_PROV_0930'
          else
            echo 'VM2_BASELINE_NO_ANNOTATION'
          fi
  victim:
    name: vm2-annoretry-victim
    runs-on: ubuntu-latest
    steps:
      - name: Fail first attempt only
        shell: bash
        run: |
          echo "VM2_VICTIM_ATTEMPT=${{ github.run_attempt }}"
          if [ "${{ github.run_attempt }}" = "1" ]; then
            echo 'VM2_VICTIM_CONTROLLED_FAILURE'
            exit 1
          fi
          echo 'VM2_VICTIM_RETRY_SUCCESS'
